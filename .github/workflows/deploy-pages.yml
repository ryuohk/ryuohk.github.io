name: Deploy CramBot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Must precede the web build: packaging drops the extension zip into
      # apps/web/public, and Vite copies that directory into the deployed site.
      - run: npm run build --workspace @crambot/extension
      - run: npm run build --workspace @crambot/web
        env:
          # Repository variables, not secrets: the Supabase URL and anon key are
          # meant to be public. Access is enforced by row level security and the
          # invite list, not by hiding these values. Leave them unset to build a
          # local-only app with no sign-in.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
